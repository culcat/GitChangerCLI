[package]
name = "gitchanger"
version = "0.1.0"
edition = "2021"
authors = ["culcat"]
description = "Fast, native CLI tool to manage and switch between multiple Git accounts and SSH configurations"
repository = "https://github.com/culcat/GitChangerCLI"
license = "MIT"

[[bin]]
name = "gitchanger"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
inquire = "0.7"
colored = "2.1"
comfy-table = "7.1"
dirs = "5.0"
anyhow = "1.0"
regex = "1.10"
